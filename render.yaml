services:
  - type: web
    name: skillforge-whatsapp-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: ACADEMY_URL
        value: https://skillforgeacademy-7xln.onrender.com
      - key: WHATSAPP_GROUP_URL
        value: https://chat.whatsapp.com/GbG1r1d1VcnKVWQkOwOr1t?s=cl&p=a&mlu=4&ilr=4
      - key: BUSINESS_WHATSAPP_URL
        value: https://wa.me/2349062206231
      - key: SIWES_CONNECT_URL
        value: https://siwes-connect-gzlj.onrender.com
      - key: MERRY_GOLD_URL
        value: https://merrygoldstore.online
      - key: HUMAN_HANDOFF_HOURS
        value: "12"
